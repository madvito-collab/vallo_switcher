<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#77C8FF"/><stop offset=".49" stop-color="#2589EC"/><stop offset="1" stop-color="#1262C7"/></linearGradient>
 <linearGradient id="key" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDF6FF"/></linearGradient>
 <linearGradient id="symbol" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#287DDA"/><stop offset="1" stop-color="#155DBB"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="23"/></filter>
</defs>
<!-- macOS-style rounded-square icon with a raised keyboard key. -->
<rect x="32" y="32" width="960" height="960" rx="212" fill="url(#bg)"/>
<rect x="56" y="47" width="912" height="904" rx="198" fill="none" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="6"/>
<rect x="168" y="231" width="688" height="608" rx="131" fill="#0B417E" opacity=".34" filter="url(#shadow)"/>
<rect x="166" y="200" width="692" height="606" rx="130" fill="url(#key)"/>
<rect x="170" y="204" width="684" height="596" rx="125" fill="none" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="8"/>
<!-- One bold Return/Enter mark, shaped like the familiar bent keyboard arrow. -->
<path d="M701 328 V600 H327" fill="none" stroke="url(#symbol)" stroke-width="73" stroke-linecap="butt" stroke-linejoin="miter"/>
<path d="M422 505 327 600 422 695" fill="none" stroke="url(#symbol)" stroke-width="73" stroke-linecap="butt" stroke-linejoin="miter"/>
</svg>