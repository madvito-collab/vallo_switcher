<!-- Окно плагина: пока работает — невидимое — держит связь со свитчером и пересылает сообщения code.js ↔ свитчер.
     После работы показывает итог: что исправлено. -->
<style>
  /* Окно итога. Шапку с «ё», названием и крестиком рисует сама Фигма. */
  body { margin: 0; background: #fff; font-family: Inter, system-ui, sans-serif; line-height: normal; color: #000; }
  #stats { display: flex; flex-direction: column; gap: 24px; padding: 12px; }
  .summary { display: flex; gap: 32px; align-items: flex-start; padding: 24px; border: 1px solid #e7ebf1; border-radius: 12px; }
  .summary > div { width: 147px; display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 14px; color: #768694; }
  .value { font-size: 24px; font-weight: 500; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .title { padding: 0 8px; font-size: 14px; font-weight: 700; color: #5b5b5b; }
  /* в макете 4 строки на высоте 182 — шаг между строками ≈ 19 */
  .list { display: flex; flex-direction: column; gap: 19px; padding: 24px; background: #f1f4f9; border-radius: 12px; font-size: 16px; }
  .row { display: flex; justify-content: space-between; align-items: flex-start; }
  .row .name { color: #768694; }
  .row .num { font-weight: 500; }
  .note { padding: 0 8px; font-size: 14px; color: #768694; }
  button { border: 0; border-radius: 12px; padding: 16px 8px; background: #000; color: #fff;
           font: 500 16px/normal Inter, system-ui, sans-serif; cursor: pointer; }
</style>
<div id="stats"></div>
<script>
const URL = "ws://localhost:48731";
let socket = null;
let file = null;
let fresh = true;   // первое подключение этого запуска — свитчер сразу пришлёт работу

function connect() {
  let wasOpen = false;
  try { socket = new WebSocket(URL); } catch (e) { return retry(); }
  socket.onopen = () => {
    wasOpen = true;
    parent.postMessage({ pluginMessage: { type: "connected" } }, "*");
    if (file !== null) hello();
  };
  socket.onmessage = (e) => {
    try { parent.postMessage({ pluginMessage: { from: "switcher", message: JSON.parse(e.data) } }, "*"); } catch (_) {}
  };
  socket.onclose = () => {
    if (wasOpen) parent.postMessage({ pluginMessage: { type: "disconnected" } }, "*");
    retry();
  };
  socket.onerror = () => {};   // onclose придёт следом
}

let retryTimer = null;
function retry() {
  socket = null;
  if (retryTimer) return;
  retryTimer = setTimeout(() => { retryTimer = null; connect(); }, 2000);
}

function hello() {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  send({ type: "hello", version: 1, file, fresh });
  fresh = false;
}

function send(message) {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
}

// порядок — как в макете; опечатки, тире и кавычки — рядом с родственными
const LABELS = [
  ["commas", "Запятые"], ["typos", "Опечатки"], ["nbsp", "Неразрывные пробелы"], ["dashes", "Тире"],
  ["quotes", "Кавычки"], ["other", "Другие знаки"], ["yo", "Заменено е на ё"],
];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function figure(label, value) {
  const d = el("div");
  d.append(el("div", "label", label), el("div", "value", value));
  return d;
}

function layersWord(n) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return "слой";
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return "слоя";
  return "слоёв";
}

function showStats(stats, skipped, failed) {
  const box = document.getElementById("stats");
  box.replaceChildren();
  const rows = LABELS.filter(([k]) => stats[k] > 0);
  const total = rows.reduce((sum, [k]) => sum + stats[k], 0);
  const summary = el("div", "summary");
  if (rows.length === 0) {
    const d = el("div");
    d.style.width = "auto";
    d.append(el("div", "label", "Исправлять нечего"), el("div", "value", "Всё уже в порядке"));
    summary.append(d);
    box.append(summary);
  } else {
    summary.append(figure("Изменено", `${stats.layers} ${layersWord(stats.layers)}`), figure("Исправлений", String(total)));
    const list = el("div", "list");
    for (const [k, label] of rows) {
      const r = el("div", "row");
      r.append(el("span", "name", label), el("span", "num", String(stats[k])));
      list.append(r);
    }
    const group = el("div", "group");
    group.append(el("div", "title", "Что исправлено"), list);
    box.append(summary, group);
  }
  if (skipped > 0) box.append(el("div", "note", `Пропущено слоёв без шрифта: ${skipped}`));
  if (failed > 0) box.append(el("div", "note", `Не изменены — слой поменяли или удалили во время работы: ${failed}`));
  const ok = el("button", "", "Закрыть");
  ok.onclick = () => parent.postMessage({ pluginMessage: { type: "hide" } }, "*");
  box.append(ok);
  // пока окно спрятано, браузер его не раскладывает и высота неверная: сначала показать, потом измерить
  parent.postMessage({ pluginMessage: { type: "show" } }, "*");
  requestAnimationFrame(() => requestAnimationFrame(() => {
    parent.postMessage({ pluginMessage: { type: "resize", height: box.offsetHeight } }, "*");
  }));
}

window.onmessage = (e) => {
  const m = e.data.pluginMessage;
  if (!m) return;
  if (m.type === "file") {
    file = m.name;
    hello();
  } else if (m.type === "send") {
    send(m.message);
  } else if (m.type === "stats") {
    showStats(m.stats, m.skipped, m.failed || 0);
  }
};

connect();
</script>
